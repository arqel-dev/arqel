name: Security

on:
  pull_request:
  push:
    branches: [master, main]
  schedule:
    # Corre diariamente às 06:00 UTC.
    - cron: "0 6 * * *"

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql-js:
    # Code scanning requires GitHub Advanced Security on private repos.
    # Skipping until the repo is public (Arqel is open source MIT) or GHAS is
    # purchased. Re-enable by removing the `if: false` line below.
    name: CodeQL — JavaScript/TypeScript
    runs-on: ubuntu-latest
    if: false
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4.37.3
        with:
          category: "/language:javascript-typescript"

  codeql-php:
    # CodeQL PHP is beta as of 2026-04 AND requires GHAS on private repos.
    # Skipping until the repo is public or GHAS is purchased.
    name: CodeQL — PHP (best-effort)
    runs-on: ubuntu-latest
    if: false
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.3
        with:
          languages: php

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4.37.3
        with:
          category: "/language:php"

  audit-composer:
    name: composer audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Composer audit
        run: composer audit --ansi

  audit-pnpm:
    name: osv-scanner (JS deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # NOTE: `pnpm audit` relied on npm's legacy quick/audits endpoints,
      # which npm retired (both now return HTTP 410 — "use the bulk advisory
      # endpoint"), so that step failed unconditionally regardless of actual
      # vulnerabilities (see #383). Replaced with osv-scanner, which scans
      # pnpm-lock.yaml directly against the OSV database and doesn't depend
      # on the retired npm endpoint. osv-scanner.toml at the repo root
      # documents any ignored advisories with justification.
      - name: Run osv-scanner against pnpm-lock.yaml
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml
            --config=osv-scanner.toml
